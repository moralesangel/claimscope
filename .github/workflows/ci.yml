name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run python -m ruff check .

      - name: Format
        run: uv run python -m ruff format --check .

      - name: Types
        run: uv run python -m mypy src eval

      # Docker is available on this runner, so the sandbox containment tests
      # run here even though they skip on a developer machine without it.
      - name: Tests
        run: uv run python -m pytest -q

      - name: Checkpoint serialization under the future strict mode
        run: uv run python -m pytest -q tests/test_session.py tests/test_resume.py
        env:
          LANGGRAPH_STRICT_MSGPACK: "true"
