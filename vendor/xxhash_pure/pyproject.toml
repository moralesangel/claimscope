[project]
name = "xxhash"
version = "3.6.0"
description = "Pure-Python XXH3-128 shim for environments where the native wheel is blocked"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xxhash"]
