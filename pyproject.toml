[project]
name = "claimscope"
version = "0.1.0"
description = "Agent that tests ML paper claims at reduced scale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "arxiv>=2.1",
    "pymupdf>=1.24",
    "docker>=7.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    # Transitive (langgraph, langsmith), pinned here so tool.uv.sources can redirect it.
    "xxhash>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
claimscope = "claimscope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimscope"]

# Smart App Control on the dev machine blocks the unsigned native DLL in every PyPI
# xxhash wheel, and langgraph imports xxh3_128_hexdigest at module scope. Point the
# dependency at a pure-Python implementation instead; it is validated bit-for-bit
# against the 12483 official XXH3-128 vectors (see vendor/xxhash_pure/ and
# tests/test_xxhash_shim.py), so digests stay compatible with a normal install.
[tool.uv.sources]
xxhash = { path = "vendor/xxhash_pure", editable = true }

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Markdown here is documentation, not source; ruff must not reformat its code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["arxiv.*", "fitz.*", "docker.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The langsmith plugin is autoloaded via langchain and pulls in xxhash at import time.
# We do not use it, and tracing is opt-in (PLAN.md section 3), so keep it out of the run.
addopts = "-p no:langsmith_plugin"
markers = [
    "llm: test hits the real LLM API; run on demand only",
]
